name: stride

# No `create-app-role` service here, unlike docker-compose.prod.yml —
# local dev never containerizes the app (it runs directly on the host,
# reaching `db` through its published port below), so there's no builder
# stage to run the script from. Once `db` is up, just run the script
# directly on the host instead: `npm run db:create-app-role`. It reads
# POSTGRES_APP_USER/POSTGRES_APP_PASSWORD and connects using the same
# POSTGRES_HOST=localhost owner connection the host-run app itself uses.

services:
  db:
    image: postgres:16
    container_name: stride-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-stride}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  storage:
    image: rustfs/rustfs:latest
    container_name: stride-storage
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_VOLUMES: "/data"
    volumes:
      - rustfs_data:/data

  # A fake mail server for development: it accepts every email over SMTP
  # and shows it in a web inbox — http://localhost:8025 — instead of
  # delivering it. Nothing ever reaches a real address, whatever the "to".
  # Used with EMAIL_TRANSPORT=smtp, SMTP_HOST=localhost, SMTP_PORT=1025.
  # No volume on purpose: the inbox is scratch space, emptied when the
  # container is recreated (it also keeps only the newest 500 messages).
  mailpit:
    image: axllent/mailpit:latest
    container_name: stride-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP — where the app sends
      - "8025:8025" # web inbox — where you read

  # === Error tracking (decisions §32) — OPTIONAL in development ===
  # GlitchTip, an open-source error tracker that speaks Sentry's protocol,
  # with its OWN Postgres (Stride's database never shares a server, settings
  # or load with it). Started only on request — it costs ~0.5 GB of RAM:
  #
  #   docker compose --profile errors up -d
  #
  # Then open http://localhost:8000, create the first account
  # (`docker compose exec glitchtip ./manage.py createsuperuser`), an
  # organization and two projects — "stride-api" (Node) and "stride-web"
  # (React) — and copy their DSNs into .env as SENTRY_DSN and
  # SENTRY_BROWSER_DSN. Without them the app reports nothing (the default).
  glitchtip-db:
    image: postgres:18
    container_name: stride-glitchtip-db
    restart: unless-stopped
    profiles: ["errors"]
    # GlitchTip partitions its event tables; Postgres's default lock table is
    # too small for that (GlitchTip's own install guide sets this). It
    # applies to this server only — another reason for a server of its own.
    command: -c max_locks_per_transaction=512
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD:-glitchtip}
      POSTGRES_DB: glitchtip
    volumes:
      - glitchtip_pgdata:/var/lib/postgresql

  glitchtip:
    # GlitchTip's own install guide uses the major tag; pin the exact
    # version you pulled once it runs (see deferred-improvements.md, like
    # Mailpit's).
    image: glitchtip/glitchtip:6
    container_name: stride-glitchtip
    restart: unless-stopped
    profiles: ["errors"]
    depends_on:
      - glitchtip-db
    ports:
      - "8000:8000" # the web interface AND where the SDKs send
    environment:
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD:-glitchtip}@glitchtip-db:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-dev-only-not-a-secret-change-me}
      GLITCHTIP_DOMAIN: http://localhost:8000
      DEFAULT_FROM_EMAIL: glitchtip@stride.test
      # Its alert emails land in Mailpit, like the app's.
      EMAIL_URL: smtp://mailpit:1025
      # The small set-up: web and worker in ONE process, and Postgres for the
      # task queue and cache — no Valkey / Redis container.
      SERVER_ROLE: all_in_one
      VALKEY_URL: ""
      # Errors only: logs go to Better Stack, uptime is watched from outside.
      GLITCHTIP_ENABLE_LOGS: "False"
      GLITCHTIP_ENABLE_UPTIME: "False"
      ENABLE_ADMIN: "False"
      ENABLE_OPENAPI: "False"
      GLITCHTIP_ENABLE_MCP: "False"
      GLITCHTIP_ENABLE_DUCKDB: "False"
    volumes:
      - glitchtip_uploads:/code/uploads

volumes:
  pgdata:
  rustfs_data:
  glitchtip_pgdata:
  glitchtip_uploads: