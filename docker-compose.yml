name: stride

# No `create-app-role` service here, unlike docker-compose.prod.yml —
# local dev never containerizes the app (it runs directly on the host,
# reaching `db` through its published port below), so there's no builder
# stage to run the script from. Once `db` is up, just run the script
# directly on the host instead: `npm run db:create-app-role`. It reads
# POSTGRES_APP_USER/POSTGRES_APP_PASSWORD and connects using the same
# POSTGRES_HOST=localhost owner connection the host-run app itself uses.

services:
  db:
    image: postgres:16
    container_name: stride-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-stride}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  storage:
    image: rustfs/rustfs:latest
    container_name: stride-storage
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_VOLUMES: "/data"
    volumes:
      - rustfs_data:/data
 
volumes:
  pgdata:
  rustfs_data: