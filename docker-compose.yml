name: stride

# No `create-app-role` service here, unlike docker-compose.prod.yml —
# local dev never containerizes the app (it runs directly on the host,
# reaching `db` through its published port below), so there's no builder
# stage to run the script from. Once `db` is up, just run the script
# directly on the host instead: `npm run db:create-app-role`. It reads
# POSTGRES_APP_USER/POSTGRES_APP_PASSWORD and connects using the same
# POSTGRES_HOST=localhost owner connection the host-run app itself uses.

services:
  db:
    image: postgres:16
    container_name: stride-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-stride}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  storage:
    image: rustfs/rustfs:latest
    container_name: stride-storage
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_VOLUMES: "/data"
    volumes:
      - rustfs_data:/data

  # A fake mail server for development: it accepts every email over SMTP
  # and shows it in a web inbox — http://localhost:8025 — instead of
  # delivering it. Nothing ever reaches a real address, whatever the "to".
  # Used with EMAIL_TRANSPORT=smtp, SMTP_HOST=localhost, SMTP_PORT=1025.
  # No volume on purpose: the inbox is scratch space, emptied when the
  # container is recreated (it also keeps only the newest 500 messages).
  mailpit:
    image: axllent/mailpit:latest
    container_name: stride-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP — where the app sends
      - "8025:8025" # web inbox — where you read
 
volumes:
  pgdata:
  rustfs_data: