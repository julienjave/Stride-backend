name: stride

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a
    container_name: stride-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-stride}
    # Deliberately NO published port here, unlike the dev compose file —
    # nothing outside this compose network has any legitimate reason to
    # reach Postgres directly. Only the `app` service needs it, and that
    # happens via Docker's internal service-name DNS ("db"), never through
    # a port exposed to the actual internet. Occasional manual access (a
    # one-off psql session) is better done via an SSH tunnel from your own
    # machine than by leaving a port open permanently for a rare need.
    logging: *default-logging
    volumes:
      - pgdata:/var/lib/postgresql/data

  storage:
    # The same pinned image as docker-compose.yml (see its comment there):
    # what runs in production is what the suites were run against.
    image: rustfs/rustfs:1.0.0-beta.11@sha256:84ce557a0245a06a9aae5516f55ee0f007fca78d41df356f419306fdc0cb168c
    container_name: stride-storage
    restart: unless-stopped
    # Bound to 127.0.0.1 specifically, not left unpublished, and NOT 0.0.0.0
    # — the middle ground between "totally unreachable from the host" (which
    # broke both the admin console over an SSH tunnel, and this project's
    # own backup script, since both need host-level localhost access) and
    # "published to the world" (deliberately avoided originally). 127.0.0.1
    # binding means: reachable from anything running ON the Droplet itself,
    # but categorically unreachable from the public internet — not just
    # firewalled, actually absent from the public network interface
    # entirely, regardless of any firewall rule.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY must be set in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY must be set in .env}
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_VOLUMES: "/data"
    logging: *default-logging
    volumes:
      - rustfs_data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stride-app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
      - storage
    # No published port either — only Caddy needs to reach this, as "app"
    # on the internal network, matching exactly what the Caddyfile proxies to.
    logging: *default-logging

  # Run migrations with: docker compose -f docker-compose.prod.yml run --rm migrate
  #
  # Deliberately targets the BUILDER stage of the same Dockerfile, not the
  # final runtime image — the runtime stage is intentionally lean (only
  # production dependencies, only dist/), so it has neither drizzle-kit
  # (a devDependency, correctly excluded from what actually ships) nor
  # drizzle.config.ts or the migrations folder (never copied into runtime
  # at all, since the running app doesn't need them to serve requests).
  # The builder stage already has all of this, since it's what compiles the
  # app in the first place — reusing it here means no new Dockerfile stage
  # needed, and Docker's build cache is shared with the app service's own
  # build (both reference the same builder stage).
  #
  # `profiles: ["tools"]` is what keeps this from starting automatically
  # with `docker compose up` — it only ever runs when explicitly invoked.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: stride-migrate
    env_file:
      - .env
    depends_on:
      - db
    profiles: ["tools"]
    command: ["npx", "drizzle-kit", "migrate"]

  # Run once, before the app first starts, with:
  # docker compose -f docker-compose.prod.yml run --rm create-app-role
  #
  # Creates/syncs the restricted stride_app role the app's own runtime
  # queries connect as (step 0 of the RLS rollout — superuser connections
  # bypass RLS unconditionally, so this role has to exist first). Same
  # builder-stage/env_file shape as the `migrate` service above, for the
  # same reason: this needs the owner connection's admin rights to create
  # a role and grant privileges, which the runtime image deliberately
  # never has, and ts-node (a devDependency) only exists in the builder
  # stage.
  #
  # `profiles: ["tools"]` keeps this from running automatically with
  # `docker compose up` — it only runs when explicitly invoked, and is
  # safe to re-run any time (idempotent: creates the role if missing,
  # syncs its password otherwise).
  create-app-role:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: stride-create-app-role
    env_file:
      - .env
    depends_on:
      - db
    profiles: ["tools"]
    command: ["npx", "ts-node", "scripts/create-app-role.ts"]

  # Run once, after migrations, with:
  # docker compose -f docker-compose.prod.yml run --rm seed
  #
  # Seeds the exercise library. Same builder-stage/env_file shape as
  # `migrate` and `create-app-role` above, but also depends on `storage`
  # (unlike those two) because scripts/seed-exercises.ts uploads exercise
  # images via StorageService, not just writing rows to Postgres.
  #
  # `profiles: ["tools"]` keeps this from running automatically with
  # `docker compose up` — it only runs when explicitly invoked, and is
  # safe to re-run any time (idempotent: skips exercises that already exist).
  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: stride-seed
    env_file:
      - .env
    depends_on:
      - db
      - storage
    profiles: ["tools"]
    command: ["npx", "ts-node", "scripts/seed-exercises.ts"]

  # The reviewers' demo only (DEMO_MODE=on in .env — decisions §46): rebuilds
  # the demo accounts and their data, nightly and on every deploy. NEVER run
  # it by hand while the app is up — run scripts/ops/demo-reset.sh, which
  # stops the app first (no sockets left on deleted accounts, no
  # new-message sweep meeting the reset) and always starts it again.
  #
  # Two steps, the second only if the first succeeded (`&&`):
  #   1. seed-dev.ts --reset: deletes every row but the exercise library, in
  #      ONE transaction (a failure leaves yesterday's data whole), then
  #      creates the demo world. Refused unless DEMO_MODE=on (safety.ts).
  #   2. storage-sweep.ts --delete: the files no row references any more —
  #      avatars, photos of the accounts just deleted. Files younger than 24
  #      hours are never touched, so today's go the night after.
  # Same builder-stage shape as `seed` (ts-node and scripts/ live there).
  demo-reset:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: stride-demo-reset
    env_file:
      - .env
    depends_on:
      - db
      - storage
    profiles: ["tools"]
    command:
      [
        "sh",
        "-c",
        "npx ts-node scripts/seed-dev.ts --reset && npx ts-node scripts/storage-sweep.ts --delete",
      ]

  # === Error tracking (decisions §32) ===
  # GlitchTip (Sentry's protocol, self-hosted) and its OWN Postgres: Stride's
  # database never shares a server, settings or load with it. Nothing here
  # is on the internet:
  #   - the app's reports go to `glitchtip:8000` on this compose network;
  #   - the browser's reports go to the app (POST /monitoring), which checks,
  #     scrubs and forwards them here;
  #   - the web interface is bound to 127.0.0.1 — open it through an SSH
  #     tunnel (`ssh -L 8000:127.0.0.1:8000 <droplet>`, then
  #     http://localhost:8000), like the RustFS console.
  # About 0.5 GB of RAM with the settings below; add swap on a 2 GB droplet.
  glitchtip-db:
    image: postgres:18@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    container_name: stride-glitchtip-db
    restart: unless-stopped
    # GlitchTip partitions its event tables; the default lock table is too
    # small for that (GlitchTip's install guide). This server only.
    command: -c max_locks_per_transaction=512
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD:?GLITCHTIP_DB_PASSWORD must be set in .env}
      POSTGRES_DB: glitchtip
    logging: *default-logging
    volumes:
      - glitchtip_pgdata:/var/lib/postgresql

  glitchtip:
    # Pin the exact version once the first deployment runs (the major tag is
    # GlitchTip's own default).
    image: glitchtip/glitchtip:6@sha256:a3d8eb1b36c1e1603d55ab32711ea3dd8115874742a781a57391a62a16e0dff6
    container_name: stride-glitchtip
    restart: unless-stopped
    depends_on:
      - glitchtip-db
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD}@glitchtip-db:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?GLITCHTIP_SECRET_KEY must be set in .env}
      # The address its own pages and emails use — through the SSH tunnel.
      GLITCHTIP_DOMAIN: http://localhost:8000
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-glitchtip@localhost}
      # Alert emails: set EMAIL_URL to an SMTP URL to receive them; until
      # then they're written to its log.
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
      # One process (web + worker), Postgres as the queue and cache: no
      # Valkey container.
      SERVER_ROLE: all_in_one
      VALKEY_URL: ""
      # Accounts are created by hand (`docker compose -f
      # docker-compose.prod.yml exec glitchtip ./manage.py createsuperuser`):
      # nobody signs up.
      ENABLE_USER_REGISTRATION: "False"
      GLITCHTIP_ENABLE_LOGS: "False"
      GLITCHTIP_ENABLE_UPTIME: "False"
      ENABLE_ADMIN: "False"
      ENABLE_OPENAPI: "False"
      GLITCHTIP_ENABLE_MCP: "False"
      GLITCHTIP_ENABLE_DUCKDB: "False"
    logging: *default-logging
    volumes:
      - glitchtip_uploads:/code/uploads

  caddy:
    image: caddy:2@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e
    container_name: stride-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    logging: *default-logging
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Caddy's own data volume — CRITICAL that this persists across
      # restarts, since it's where Let's Encrypt certificates are actually
      # stored. Without a persistent volume here, Caddy would request a
      # brand new certificate on every single container restart, risking
      # hitting Let's Encrypt's real rate limits.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  rustfs_data:
  caddy_data:
  caddy_config:
  glitchtip_pgdata:
  glitchtip_uploads: